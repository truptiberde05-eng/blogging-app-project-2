server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: thoughtline-api
  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:thoughtline}
    username: ${PGUSER:}
    password: ${PGPASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  jackson:
    default-property-inclusion: non_null
  sql:
    init:
      mode: never

app:
  jwt:
    secret: ${JWT_SECRET:${SESSION_SECRET}}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
